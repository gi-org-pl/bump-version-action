name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a pull request branch
        env:
          GIT_AUTHOR_NAME: test
          GIT_AUTHOR_EMAIL: test@example.com
          GIT_COMMITTER_NAME: test
          GIT_COMMITTER_EMAIL: test@example.com
        run: |
          git init --quiet --bare "$RUNNER_TEMP/origin.git"
          git init --quiet --initial-branch=main "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git remote add origin "file://$RUNNER_TEMP/origin.git"
          echo '{ "name": "test", "version": "1.2.3" }' > package.json
          git add package.json
          git commit --quiet -m "Release 1.2.3"
          git push --quiet -u origin main
          git switch --quiet -c dependencies
          echo test > README.md
          git add README.md
          git commit --quiet -m "Update the dependencies"
          git push --quiet -u origin dependencies
      - name: Bump the version
        uses: ./
        with:
          base-ref: main
          working-directory: ${{ runner.temp }}/repo
      - name: Bump the version again
        uses: ./
        with:
          base-ref: main
          working-directory: ${{ runner.temp }}/repo
      - name: Check that the version was bumped once
        working-directory: ${{ runner.temp }}/repo
        run: |
          git fetch --quiet origin
          test "$(git show origin/dependencies:package.json | jq -r '.version')" = 1.2.4
          test "$(git rev-list --count origin/main..origin/dependencies)" = 2
          test "$(git log -1 --format=%an origin/dependencies)" = 'github-actions[bot]'
          test "$(git log -1 --format=%s origin/dependencies)" = 'Bump the version to 1.2.4 [dependabot skip]'
